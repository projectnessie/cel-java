syntax = "proto3";

option java_package = "org.projectnessie.cel.proto.tests";
option java_outer_classname = "ProtoTestTypes";
option java_generate_equals_and_hash = true;

message EventA {
  bool property_bool = 5;
  map<string, string> map_str = 11;
}

message UnsignedMaps {
  map<uint32, uint32> uint32_map = 1;
  map<fixed32, fixed32> fixed32_map = 2;
  map<uint64, uint64> uint64_map = 3;
  map<fixed64, fixed64> fixed64_map = 4;
}
