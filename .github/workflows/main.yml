name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  MAMMOTH_CACHE_PARTITIONS: '[{"id":"dependency-metadata","writer":"java-25"}]'

jobs:
  java:
    name: Java/Gradle
    runs-on: ubuntu-26.04
    strategy:
      max-parallel: 4
      matrix:
        java-version: [21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle and Caches
        uses: buildish-tooling/buildish-mammoth-cache/actions/github/gradle@5befea0047cb7f46d468765ffd8061475941c3dc # v0.6.0
        with:
          job-mode: distributed-worker
          github-job-name: java-${{ matrix.java-version }}
          cache-partitions: ${{ env.MAMMOTH_CACHE_PARTITIONS }}
          wrapper-properties-files: gradle/wrapper/gradle-wrapper.properties

      - name: Build
        run: >
          ./gradlew ${{ env.ADDITIONAL_GRADLE_OPTS }}
          assemble check publishToMavenLocal
          --scan

      - name: Quarkus native smoke
        if: ${{ matrix.java-version == '21' }}
        run: ./gradlew testNative --scan

      - name: Build tool integrations
        # The buildToolIntegration* tasks require publishToMavenLocal, run it as a separate step,
        # because these tasks intentionally do not depend on the publishToMavenLocal tasks.
        run: ./gradlew buildToolIntegrations

      - name: Capture test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-results
          path: |
            **/build/reports/*
            **/build/test-results/*

  aggregate-cache:
    name: Aggregate Gradle caches
    needs:
      - java
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository for cache aggregation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate worker caches and publish the next generation
        uses: buildish-tooling/buildish-mammoth-cache/actions/github/gradle@5befea0047cb7f46d468765ffd8061475941c3dc # v0.6.0
        with:
          job-mode: distributed-aggregator
          dependent-jobs: java-21, java-25
          cache-partitions: ${{ env.MAMMOTH_CACHE_PARTITIONS }}
          wrapper-properties-files: gradle/wrapper/gradle-wrapper.properties
